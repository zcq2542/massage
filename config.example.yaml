# 通知渠道：列表，可配 0~N 个，notify 向全部推送。
webhooks:
  - type: bark
    url: https://api.day.app/XXXXXXXX
  - type: dingtalk
    webhook: https://oapi.dingtalk.com/robot/send?access_token=XXXXXXXX
    secret: SECXXXXXXXX
  - type: serverchan
    sendkey: SCTXXXXXXXX
timing:
  start_lead_seconds: 60
  release_time: "20:00"
  pre_poll_seconds: 1.0
  poll_interval_ms: 50
  poll_concurrency: 2  # concurrent GetSchedule polls per round (tail-latency vs server load tradeoff)
  fire_concurrency: 3
  total_timeout_s: 30.0
rotation:
  enabled: true
  weekly_quota: 1
  state_file: state.json
safety:
  dedup: true
  auto_cancel_extras: true
